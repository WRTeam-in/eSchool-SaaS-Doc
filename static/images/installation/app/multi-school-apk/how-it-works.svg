<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 452" width="1000" height="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>How the Multi-School APK add-on builds one app per school</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#205479"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="452" rx="16" fill="#ffffff"/>

  <!-- Column 1: inputs -->
  <text x="134" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="#6b7280" letter-spacing="1.2">YOU PROVIDE</text>

  <rect x="24" y="64" width="220" height="112" rx="12" fill="#f3f6fa" stroke="#d7dee8"/>
  <text x="44" y="100" font-size="17" font-weight="700" fill="#1f2937">eSchool app code</text>
  <text x="44" y="126" font-size="14" fill="#4b5563">One Flutter project,</text>
  <text x="44" y="148" font-size="14" fill="#4b5563">unchanged</text>

  <rect x="24" y="196" width="220" height="176" rx="12" fill="#f3f6fa" stroke="#d7dee8"/>
  <text x="44" y="232" font-size="17" font-weight="700" fill="#1f2937">Your schools</text>
  <text x="44" y="258" font-size="14" fill="#4b5563">Name, package ID, icon,</text>
  <text x="44" y="280" font-size="14" fill="#4b5563">logo, colours, Firebase,</text>
  <text x="44" y="302" font-size="14" fill="#4b5563">school code, signing key</text>
  <text x="44" y="338" font-size="13" fill="#205479" font-family="SFMono-Regular, Menlo, Consolas, monospace">addon/config/</text>
  <text x="44" y="356" font-size="13" fill="#205479" font-family="SFMono-Regular, Menlo, Consolas, monospace">schools.json</text>

  <!-- arrows into builder -->
  <path d="M252 120 L292 180" stroke="#205479" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M252 284 L292 240" stroke="#205479" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Column 2: builder -->
  <text x="500" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="#6b7280" letter-spacing="1.2">SCHOOL BUILDER (ADD-ON)</text>
  <rect x="300" y="64" width="400" height="344" rx="14" fill="#205479"/>

  <g font-size="15">
    <circle cx="336" cy="104" r="15" fill="#ffffff"/>
    <text x="336" y="109" text-anchor="middle" font-weight="700" fill="#205479">1</text>
    <text x="364" y="100" font-weight="700" fill="#ffffff">Validate</text>
    <text x="364" y="120" font-size="13" fill="#cfe0ee">Checks icon, Firebase, signing and app type</text>

    <circle cx="336" cy="170" r="15" fill="#ffffff"/>
    <text x="336" y="175" text-anchor="middle" font-weight="700" fill="#205479">2</text>
    <text x="364" y="166" font-weight="700" fill="#ffffff">Generate the school</text>
    <text x="364" y="186" font-size="13" fill="#cfe0ee">Its icons, splash and IDs, in its own folder</text>

    <circle cx="336" cy="236" r="15" fill="#ffffff"/>
    <text x="336" y="241" text-anchor="middle" font-weight="700" fill="#205479">3</text>
    <text x="364" y="232" font-weight="700" fill="#ffffff">Build</text>
    <text x="364" y="252" font-size="13" fill="#cfe0ee">Runs the normal Flutter release build</text>

    <circle cx="336" cy="302" r="15" fill="#ffffff"/>
    <text x="336" y="307" text-anchor="middle" font-weight="700" fill="#205479">4</text>
    <text x="364" y="298" font-weight="700" fill="#ffffff">Save</text>
    <text x="364" y="318" font-size="13" fill="#cfe0ee">Names the APK and stores it per school</text>

    <circle cx="336" cy="368" r="15" fill="#ffffff"/>
    <text x="336" y="373" text-anchor="middle" font-weight="700" fill="#205479">5</text>
    <text x="364" y="364" font-weight="700" fill="#ffffff">Clean up</text>
    <text x="364" y="384" font-size="13" fill="#cfe0ee">Your default app is never changed</text>
  </g>

  <!-- arrows out of builder -->
  <path d="M708 180 L748 120" stroke="#205479" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M708 236 L748 236" stroke="#205479" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M708 292 L748 352" stroke="#205479" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Column 3: outputs -->
  <text x="866" y="44" text-anchor="middle" font-size="13" font-weight="700" fill="#6b7280" letter-spacing="1.2">YOU GET</text>

  <rect x="756" y="76" width="220" height="92" rx="12" fill="#ffffff" stroke="#d7dee8"/>
  <rect x="772" y="96" width="40" height="40" rx="10" fill="#f59e0b"/>
  <text x="826" y="112" font-size="15" font-weight="700" fill="#1f2937">Sunrise School</text>
  <text x="826" y="133" font-size="12" fill="#6b7280" font-family="SFMono-Regular, Menlo, Consolas, monospace">build/sunrise/</text>
  <text x="826" y="150" font-size="12" fill="#6b7280" font-family="SFMono-Regular, Menlo, Consolas, monospace">android/…apk</text>

  <rect x="756" y="190" width="220" height="92" rx="12" fill="#ffffff" stroke="#d7dee8"/>
  <rect x="772" y="210" width="40" height="40" rx="10" fill="#123059"/>
  <text x="826" y="226" font-size="15" font-weight="700" fill="#1f2937">Greenfield School</text>
  <text x="826" y="247" font-size="12" fill="#6b7280" font-family="SFMono-Regular, Menlo, Consolas, monospace">build/greenfield/</text>
  <text x="826" y="264" font-size="12" fill="#6b7280" font-family="SFMono-Regular, Menlo, Consolas, monospace">android/…apk</text>

  <rect x="756" y="304" width="220" height="92" rx="12" fill="#ffffff" stroke="#d7dee8"/>
  <rect x="772" y="324" width="40" height="40" rx="10" fill="#1e6b52"/>
  <text x="826" y="340" font-size="15" font-weight="700" fill="#1f2937">Any school…</text>
  <text x="826" y="361" font-size="12" fill="#6b7280" font-family="SFMono-Regular, Menlo, Consolas, monospace">build/&lt;school-id&gt;/</text>
  <text x="826" y="378" font-size="12" fill="#6b7280" font-family="SFMono-Regular, Menlo, Consolas, monospace">android/…apk</text>

  <text x="500" y="438" text-anchor="middle" font-size="13" fill="#6b7280">Each app has its own name, icon, colours and Firebase project. Your default app's files are never replaced.</text>
</svg>
