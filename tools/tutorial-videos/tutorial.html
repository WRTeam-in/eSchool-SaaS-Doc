<!doctype html>
<html><head><meta charset="utf-8"><title>tutorial render</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="engine.js"></script>
<script>
  // tutorial.html?story=<id> loads stories/<id>.js and builds the timeline.
  const id = new URLSearchParams(location.search).get('story');
  const s = document.createElement('script');
  s.src = 'stories/' + id + '.js';
  window.ready = new Promise((resolve, reject) => {
    s.onload = async () => { try { const story = await buildStory(); window.STORY = story; resolve(await initTutorial(story)); } catch (e) { reject(String(e)); } };
    s.onerror = () => reject('missing stories/' + id + '.js');
  });
  document.body.appendChild(s);
</script></body></html>
